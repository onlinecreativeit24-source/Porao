<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পড়াও - বিষয়ভিত্তিক পড়া</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #f7f9fc; color: #333; padding-bottom: 20px; }
        
        .header { background: #1E6091; color: white; padding: 15px 20px; display: flex; align-items: center; gap: 15px; }
        .back-btn { background: none; border: none; color: white; font-size: 20px; cursor: pointer; text-decoration: none; }
        .header h2 { font-size: 20px; font-weight: 700; }

        .content { padding: 20px; }
        .chapter-card { background: white; border-radius: 12px; padding: 15px 20px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); display: flex; justify-content: space-between; align-items: center; border: 1px solid #e1e8ed; }
        .chapter-info h4 { font-size: 16px; color: #1E6091; margin-bottom: 4px; }
        .chapter-info p { font-size: 12px; color: #666; }
        .start-btn { background: #1E6091; color: white; border: none; padding: 8px 14px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <a href="home.html" class="back-btn">⬅</a>
        <h2>উচ্চতর গণিত (Mathematics)</h2>
    </div>

    <div class="content">
        <div class="chapter-card">
            <div class="chapter-info">
                <h4>অধ্যায় ১: সেট ও ফাংশন</h4>
                <p>৩টি লেকচার • ২টি নোট</p>
            </div>
            <button class="start-btn">পড়া শুরু করুন</button>
        </div>

        <div class="chapter-card">
            <div class="chapter-info">
                <h4>অধ্যায় ২: বীজগণিতীয় রাশি</h4>
                <p>৪টি লেকচার • ১টি নোট</p>
            </div>
            <button class="start-btn">পড়া শুরু করুন</button>
        </div>

        <div class="chapter-card">
            <div class="chapter-info">
                <h4>অধ্যায় ৩: জ্যামিতি</h4>
                <p>৫টি লেকচার • ৩টি নোট</p>
            </div>
            <button class="start-btn">পড়া শুরু করুন</button>
        </div>
    </div>

</body>
</html>
