name: Deploy Payment Functions

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install function dependencies
        working-directory: functions
        run: npm install

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Write service account
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"

      - name: Save UddoktaPay secrets
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          printf '%s' "${{ secrets.UDDOKTAPAY_API_KEY }}" | firebase functions:secrets:set UDDOKTAPAY_API_KEY --data-file - --force --project porao-dd00d
          printf '%s' "${{ secrets.UDDOKTAPAY_BASE_URL }}" | firebase functions:secrets:set UDDOKTAPAY_BASE_URL --data-file - --force --project porao-dd00d

      - name: Deploy functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: firebase deploy --only functions --project porao-dd00d --force

      - name: Remove service account
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
