name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Expo packages
        run: npx expo install expo-image-picker expo-image-manipulator @react-native-async-storage/async-storage -- --legacy-peer-deps

      - name: Generate native android project
        run: npx expo prebuild --platform android --no-install

      - name: Build Release AAB
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: porao-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: porao-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: porao-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
